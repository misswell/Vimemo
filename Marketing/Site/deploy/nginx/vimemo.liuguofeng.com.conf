server {
    listen 80;
    server_name vimemo.liuguofeng.com;
    root /home/wwwroot/vimemo.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vimemo.liuguofeng.com;
    root /home/wwwroot/vimemo.liuguofeng.com;
    index index.html;

    ssl_certificate /etc/nginx/ssl/vimemo.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/vimemo.liuguofeng.com/vimemo.liuguofeng.com.key;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
